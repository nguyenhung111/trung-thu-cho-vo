<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu Yêu Thương</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="night-sky" id="night-sky">
        <div class="moon"></div>
        <!-- Stars will be generated by JS -->
        
        <!-- Floating Lanterns -->
        <div class="lantern lantern-1"></div>
        <div class="lantern lantern-2"></div>
        <div class="lantern lantern-3"></div>
        <div class="lantern lantern-4"></div>
        <div class="lantern lantern-5"></div>
        <div class="lantern lantern-6"></div>
        <div class="lantern lantern-7"></div>

        <div class="message-container">
            <h1 class="title">Chúc Mừng Trung Thu Vợ Yêu! 🌕</h1>
            <div class="photo-frame">
                <img src="kiniem.jpg" alt="Kỷ niệm Trung Thu" onerror="this.src='https://via.placeholder.com/300x400/15294a/f8e58a?text=Luu+anh+thanh+kiniem.jpg'">
            </div>
            <div class="message-box">
                <p id="typed-text"></p>
            </div>
            <div class="heart">❤️</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
